services:
  mysql:
    image: mysql:8.4
    container_name: fizyoterapi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-fizyoterapi}
      MYSQL_USER: ${DB_USER:-fizyo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fizyopass}
      TZ: Europe/Istanbul
    ports:
      - "${DB_PORT:-3308}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
